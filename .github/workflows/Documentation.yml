name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# Every push event deploys to `gh-pages`. A release tag pushed right after its
# `main` commit would otherwise race that commit's run on the final push, so
# all push events share one group and queue. Pull request runs only deploy a
# preview and can be cancelled when a newer push arrives.
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'gh-pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
